<style>

html,body{height:100%;margin:0}

.cols{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;justify-content:center}.cols div{background:rgba(255,255,255,.15);border-radius:14px;padding:12px 18px;font-size:clamp(13px,2vw,18px);text-align:left;line-height:1.6}

#qr{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:150px;height:150px;box-sizing:border-box;background:#fff;padding:10px;border:8px solid #0b0b12;border-radius:14px;box-shadow:0 0 0 4px #ffd84d,0 0 40px 10px rgba(255,216,77,.55);display:none;grid-template-columns:repeat(9,1fr);gap:2px;z-index:3}

#cap,#tag,#hud{z-index:2}
#qr i{background:#111}#qr i.w{background:#fff}
#qr::after{content:"";position:absolute;left:0;right:0;height:3px;background:red;animation:sc .4s linear 2}
@keyframes sc{from{top:0}to{top:calc(100% - 3px)}}
#bar{display:flex;gap:8px;align-items:center;width:min(96vw,960px)}
#bar button{padding:8px 14px;border-radius:8px;border:1px solid #888;background:transparent;color:var(--fg);font-size:14px;cursor:pointer}
#pg{flex:1;height:8px;background:#8884;border-radius:4px;overflow:hidden}#pb{height:100%;width:0;background:#c0507a}
</style></head><body>

 if(p&&p.o){const o=p.o;g.fillStyle=o.hr;if(o.long)g.fillRect(48,40,104,140);g.fillStyle=o.sk;g.beginPath();g.arc(100,100,48,0,7);g.fill();g.fillStyle=o.hr;g.beginPath();g.arc(100,94,50,Math.PI*1.05,Math.PI*1.95);g.fill();g.fillStyle='#222';g.fillRect(82,100,8,8);g.fillRect(110,100,8,8);

  g.fillStyle=o.sh;g.fillRect(52,152,96,40);g.fillStyle='#fff';g.font='bold 32px system-ui';g.fillText(p.n,190,80);g.font='24px system-ui';
  const w=p.c.split(' '),m=Math.ceil(w.length/2);g.fillText(w.slice(0,m).join(' '),190,120);g.fillText(w.slice(m).join(' '),190,150)}

 g.fillStyle=cls=='ok'?'#1f9d4d':cls=='no'?'#c62f2f':'#445';g.fillRect(30,220,452,64);g.fillStyle='#fff';g.font='bold 34px system-ui';g.textAlign='center';g.fillText(status,256,264);stx.needsUpdate=true;if(cls=='ok'){burst(2.3,2.1,.2,'#3ddc84');snd(880,.25,'sine',1320)}if(cls=='no'){burst(2.3,2.1,.2,'#ff4d4d');snd(160,.5,'sawtooth');shk=.6}}
// personagens
const mkL=(sk,hr,sh,lg)=>{const n=(sh+hr).split('').reduce((a,c)=>a+c.charCodeAt(0),0);return{sk,hr,sh,pt:['#3a3550','#2f4058','#4a3a3a'][n%3],long:lg,gl:n%2==0,bag:n%3!=1,ac:['#f28c28','#4fd1c5','#f6e05e','#fc8181'][n%4]}};

const MAR={o:mkL('#c68a5e','#1e1e1e','#e05a8b',1),n:'Marina Lima',c:'Técnico em Construção Naval'};
const LUC={o:mkL('#f1c9a5','#222','#2e9d6b',0),n:'Lucas',c:''};
const PED={o:mkL('#8d5a3b','#a0522d','#f2a33a',0),n:'Pedro Alves',c:'Técnico em Eletromecânica'};
const BEA={o:mkL('#e8b98f','#c0392b','#8e5bd1',1),n:'Beatriz Rocha',c:'Técnico em Desenvolvimento de Sistemas'};
const LK=[mkL('#f1c9a5','#5a3a22','#3a8fd9',0),mkL('#c68a5e','#1e1e1e','#e05a8b',1),mkL('#8d5a3b','#a0522d','#f2a33a',0),mkL('#e8b98f','#c0392b','#8e5bd1',1),mkL('#f1c9a5','#222','#2e9d6b',0),mkL('#6b4a35','#111','#e0584a',0)];
let li=0;const look=()=>LK[li++%LK.length];
function person(o){const g=new THREE.Group(),sk=M(o.sk),ac=M(o.ac||'#f28c28'),sh=M(o.sh),pt=M(o.pt||'#3a3550'),hr=M(o.hr);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,.95,0);mesh(Cy(.065,.055,.9),pt,0,-.45,0,l);mesh(Sp(.1),M('#e4e9f3'),0,-.92,.07,l).scale.set(1,.6,1.6);mesh(Sp(.06),ac,0,-.86,.1,l).scale.set(1,.5,1.2);g.add(l);return l};
 g.lL=leg(-.1);g.lR=leg(.1);
 mesh(Cy(.19,.22,.62,16),sh,0,1.27,0,g);mesh(Cy(.235,.235,.14,16),sh,0,.97,0,g);
 mesh(new THREE.TorusGeometry(.12,.045,8,16),ac,0,1.58,0,g).rotation.x=Math.PI/2;
 if(o.apron)mesh(B(.3,.55,.03),M('#fff'),0,1.15,.225,g);else mesh(B(.22,.1,.04),ac,0,1.1,.225,g);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,1.52,0);mesh(Cy(.05,.045,.62),sh,0,-.31,0,a);mesh(Sp(.06),sk,0,-.65,0,a);g.add(a);return a};
 g.aL=arm(-.27);g.aR=arm(.27);
 if(o.bag){mesh(B(.03,.8,.03),M('#7a3b4a'),0,1.2,.215,g).rotation.z=.6;mesh(B(.1,.22,.26),M('#7a3b4a'),-.3,.95,0,g)}
 const h=new THREE.Group();h.position.y=1.85;g.add(h);g.head=h;
 mesh(Sp(.21,20,14),sk,0,0,0,h);mesh(Sp(.04),sk,-.21,0,0,h);mesh(Sp(.04),sk,.21,0,0,h);
 mesh(new THREE.SphereGeometry(.228,18,10,0,Math.PI*2,0,Math.PI*.55),hr,0,.01,-.01,h).rotation.x=-.25;
 if(o.long)mesh(Sp(.23),hr,0,-.1,-.1,h).scale.set(1,1.35,.8);
 if(o.hat)mesh(Cy(.2,.22,.12),M('#fff'),0,.2,0,h);
 g.eyes=[];g.brows=[];[-.075,.075].forEach(x=>{g.eyes.push(mesh(Sp(.022,8,6),M('#111'),x,.02,.195,h));g.brows.push(mesh(B(.07,.014,.014),hr,x,.075,.2,h));if(o.gl)mesh(new THREE.TorusGeometry(.06,.009,6,16),M('#9fb7d4'),x,.02,.2,h)});

 mesh(Sp(.025,8,6),sk,0,-.03,.21,h);
 const mm=M('#8a2d2d'),mo=r=>{const m=mesh(new THREE.TorusGeometry(.05,.01,6,12,Math.PI),mm,0,-.1,.195,h);m.rotation.z=r;return m};
